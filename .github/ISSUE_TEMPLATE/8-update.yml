name: Update
description: 'Update an existing contribution: new test, fix, new failure case, reproduction'
title: '[Update] AI '
labels:
- update
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing an update. Write a short, task-based title after the prefix, for example "[Update] AI
      W0002 tested with a new model".


      You can drag and drop images (screenshots, plots) into any text box: they are copied into the site with the page. Use
      only images you made or may share under CC BY 4.0.


      The guide is in [Contribute](https://github.com/astronomicalintelligence/site/blob/main/contribute.qmd).'
- type: input
  id: catalog
  attributes:
    label: Catalogue number
    description: Shown in the list and in the page header.
    placeholder: AI W0002
  validations:
    required: true
- type: textarea
  id: changes
  attributes:
    label: What changes
    description: What is wrong or new, and the new text if you have it.
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: New test
    description: Model and version, tool, date, result.
  validations:
    required: false
- type: dropdown
  id: level
  attributes:
    label: Does this change the verification level?
    options:
    - 'No'
    - 'L1: I tested a draft on a real case'
    - 'L2: I reproduced it from scratch'
    - 'L3: I checked it across models or dates'
    multiple: false
  validations:
    required: true
- type: textarea
  id: authors
  attributes:
    label: Who to credit for this update
    description: Your name, ORCID (optional) and affiliation. The existing authors stay.
    placeholder: First Last, 0000-0000-0000-0000, Institute
  validations:
    required: true
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: I agree that the text is published under CC BY 4.0 and any code under MIT.
      required: true

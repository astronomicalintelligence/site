name: Update
description: 'Update an existing contribution: new test, fix, new failure case, reproduction'
title: '[Update] AI '
labels:
- update
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing an update. Write a short title after the prefix, for example "[Update] AI W0002 tested
      with a new model". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: catalog
  attributes:
    label: Catalogue number
    description: Shown in the list and in the page header.
    placeholder: AI W0002
  validations:
    required: true
- type: textarea
  id: changes
  attributes:
    label: What changes
    description: What is wrong or new, and the new text if you have it.
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: New test
    description: Model and version, date, what you ran it on and what came out. Say if you reproduced it from scratch (L2)
      or checked it across models or dates (L3).
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors
    description: 'One per line, as they should appear in the citation: name, then affiliation, ORCID and GitHub @username
      if you want them (only the name is needed).'
    placeholder: First Last, Institute, 0000-0000-0000-0000, @username
  validations:
    required: true

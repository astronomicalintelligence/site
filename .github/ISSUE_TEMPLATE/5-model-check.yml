name: Model check
description: A short, repeatable test of language models on a real scientific task
title: '[Model check] '
labels:
- model-check
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a model check. Write a short, task-based title after the prefix, for example "[Model check]
      Uncertainty of a ratio".


      You can drag and drop images (screenshots, plots) into any text box: they are copied into the site with the page. Use
      only images you made or may share under CC BY 4.0.


      The guide is in [Contribute](https://github.com/astronomicalintelligence/site/blob/main/contribute.qmd).'
- type: input
  id: description
  attributes:
    label: What it does, in one sentence
    placeholder: Does the model propagate uncertainties correctly when it divides two measured quantities?
  validations:
    required: true
- type: dropdown
  id: field
  attributes:
    label: Field
    options:
    - Astronomy and astrophysics
    - Physics
    - Earth and planetary sciences
    - Chemistry
    - Biology and medicine
    - Computer science
    - Other
    multiple: false
  validations:
    required: false
- type: textarea
  id: task
  attributes:
    label: Task
    description: What is asked, and why it is a good test.
    placeholder: A car covers 12.0 ± 0.5 km in 3.0 ± 0.2 h. What is its average speed, with uncertainty? Models often add
      the errors linearly instead of in quadrature.
  validations:
    required: true
- type: textarea
  id: prompt
  attributes:
    label: Prompt
    description: Exactly as given to every model, with nothing added.
    render: text
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected answer and pass rule
    description: The correct answer and the rule to mark a reply pass or fail, for example "within 5%, with units".
    placeholder: '4.0 ± 0.3 km/h (relative errors added in quadrature). Pass: 4.0 km/h and an uncertainty between 0.30 and
      0.32 km/h, with units.'
  validations:
    required: true
- type: textarea
  id: results
  attributes:
    label: Results
    description: 'One line per model: model and version, date, answer, pass or fail.'
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors to credit
    description: 'One per line: name, ORCID (optional), affiliation, as they should appear in the citation.'
    placeholder: First Last, 0000-0000-0000-0000, Institute
  validations:
    required: true
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: I agree that the text is published under CC BY 4.0 and any code under MIT.
      required: true

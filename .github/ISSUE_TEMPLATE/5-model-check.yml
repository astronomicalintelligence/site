name: Model check
description: A short, repeatable test of language models on a real scientific task
title: '[Model check] '
labels:
- model-check
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a model check. Write a short title after the prefix, for example "[Model check] Uncertainty
      of a ratio". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT. You are credited with the name on your GitHub profile unless you write other
      authors below.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What it checks, in one sentence
    placeholder: Does the model propagate uncertainties correctly when it divides two measured quantities?
  validations:
    required: true
- type: textarea
  id: prompt
  attributes:
    label: Prompt
    description: Exactly as given to every model, with nothing added.
    render: text
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected answer and pass rule
    description: The correct answer and the rule to mark a reply pass or fail.
    placeholder: '4.0 ± 0.3 km/h (relative errors added in quadrature). Pass: 4.0 km/h and an uncertainty between 0.30 and
      0.32 km/h, with units. Models often add the errors linearly (0.43).'
  validations:
    required: true
- type: textarea
  id: results
  attributes:
    label: Results
    description: 'One line per model: model and version, date, answer, pass or fail.'
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors, if not only you
    description: 'Leave empty to be credited with the name on your GitHub profile. Otherwise one per line: name, ORCID (optional),
      affiliation (optional), GitHub @username (optional).'
    placeholder: First Last, 0000-0000-0000-0000, Institute, @username
  validations:
    required: false

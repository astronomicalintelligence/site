name: Workflow
description: A step-by-step procedure for a research task
title: '[Workflow] '
labels:
- workflow
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a workflow. Write a short title after the prefix, for example "[Workflow] Literature search
      with NASA ADS". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What it does, in one sentence
    placeholder: Map a research field from ADS abstracts, with every claim tied to a bibcode you can check.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps
    description: Numbered steps, starting with what you need (accounts, software, data). Put each prompt in a code block,
      exactly as you used it.
  validations:
    required: true
- type: textarea
  id: check
  attributes:
    label: How to check the result
    description: 'Concrete: what to compare, recompute or look up. Not ''verify the output''.'
    placeholder: Check that every cited bibcode is in the exported file; compare five claims with their abstracts.
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: How you tested it
    description: 'Leave empty if you have not tested it yet: it is published as a draft (L0). Otherwise start with the model
      and the date, then the real task you ran it on and what came out (L1).'
    placeholder: 'Claude Opus 5.5 in claude.ai, 2026-11-03: 50 refereed abstracts on exoplanet atmospheres; all 31 cited bibcodes
      were in the file. It took 40 minutes instead of 3 hours.'
  validations:
    required: false
- type: textarea
  id: fails
  attributes:
    label: Known failures
    description: Cases where it gave wrong results, or limits you know of.
    placeholder: 'Results that are only in the body of papers are invisible: the model sees abstracts only.'
  validations:
    required: false
- type: dropdown
  id: phase
  attributes:
    label: Research phase
    options:
    - Literature
    - Proposals
    - Data and code
    - Analysis
    - Writing
    - Pre-submission review
    - General (any phase)
    multiple: false
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors
    description: 'One per line, as they should appear in the citation: name, then affiliation, ORCID and GitHub @username
      if you want them (only the name is needed).'
    placeholder: First Last, Institute, 0000-0000-0000-0000, @username
  validations:
    required: true

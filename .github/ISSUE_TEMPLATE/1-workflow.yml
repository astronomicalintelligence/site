name: Workflow
description: A step-by-step procedure for a research task
title: '[Workflow] '
labels:
- workflow
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a workflow. Write a short, task-based title after the prefix, for example "[Workflow]
      Literature search with NASA ADS".


      You can drag and drop images (screenshots, plots) into any text box: they are copied into the site with the page. Use
      only images you made or may share under CC BY 4.0.


      A maintainer checks every proposal; when it is marked **ready** it is turned into a page and a pull request, and it
      gets its catalogue number when it is published. The guide is in [Contribute](https://github.com/astronomicalintelligence/site/blob/main/contribute.qmd).'
- type: input
  id: description
  attributes:
    label: What it does, in one sentence
    placeholder: Map a research field from ADS abstracts, with every claim tied to a bibcode you can check.
  validations:
    required: true
- type: dropdown
  id: phase
  attributes:
    label: Research phase
    options:
    - Literature
    - Proposals
    - Data and code
    - Analysis
    - Writing
    - Pre-submission review
    - General (any phase)
    multiple: false
  validations:
    required: true
- type: dropdown
  id: field
  attributes:
    label: Field
    options:
    - Astronomy and astrophysics
    - Physics
    - Earth and planetary sciences
    - Chemistry
    - Biology and medicine
    - Computer science
    - Other
    multiple: false
  validations:
    required: false
- type: textarea
  id: goal
  attributes:
    label: Goal
    description: The task it solves, when to use it and when not to.
    placeholder: Get a first map of a topic from papers you chose, without invented references.
  validations:
    required: true
- type: textarea
  id: need
  attributes:
    label: What you need
    description: Accounts, software, data.
    placeholder: A NASA ADS account and API token; Python with requests; a model that accepts file uploads.
  validations:
    required: false
- type: textarea
  id: steps
  attributes:
    label: Steps
    description: Numbered steps. Put each prompt in a code block, exactly as you used it.
  validations:
    required: true
- type: textarea
  id: check
  attributes:
    label: How to check the result
    description: 'Concrete: what to compare, recompute or look up. Not ''verify the output''.'
    placeholder: Check that every cited bibcode is in the exported file; compare five claims with their abstracts.
  validations:
    required: true
- type: textarea
  id: fails
  attributes:
    label: Known failures
    description: Cases where it gave wrong results, or limits you know of. Leave empty if you know of none yet.
    placeholder: 'Results that are only in the body of papers are invisible: the model sees abstracts only.'
  validations:
    required: false
- type: input
  id: time_saved
  attributes:
    label: Time saved (measured)
    description: How long the task took without and with the workflow. Leave empty if you did not measure it.
    placeholder: 3 h -> 40 min
  validations:
    required: false
- type: input
  id: model
  attributes:
    label: Model and version
    description: 'Needed for L1: the exact model and version you used.'
    placeholder: for example Claude Opus 5.5
  validations:
    required: false
- type: input
  id: tool
  attributes:
    label: Tool or interface
    placeholder: for example claude.ai, Claude Code, Codex, ChatGPT, the API
  validations:
    required: false
- type: input
  id: tested
  attributes:
    label: Date of your test
    description: Needed for L1.
    placeholder: YYYY-MM-DD
  validations:
    required: false
- type: textarea
  id: test_case
  attributes:
    label: Test case
    description: 'Needed for L1: the real task you ran it on and what came out.'
    placeholder: 50 refereed abstracts on exoplanet atmospheres (2018-2026); all 31 cited bibcodes were in the file.
  validations:
    required: false
- type: dropdown
  id: level
  attributes:
    label: Verification level
    options:
    - 'L0: a proposal, not tested yet'
    - 'L1: tested on a real case (fill in model, date and test case)'
    multiple: false
  validations:
    required: true
- type: textarea
  id: authors
  attributes:
    label: Authors to credit
    description: 'One per line: name, ORCID (optional), affiliation, as they should appear in the citation.'
    placeholder: First Last, 0000-0000-0000-0000, Institute
  validations:
    required: true
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: I agree that the text is published under CC BY 4.0 and any code under MIT.
      required: true

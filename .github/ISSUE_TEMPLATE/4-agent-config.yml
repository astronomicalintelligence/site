name: Agent config
description: A CLAUDE.md or AGENTS.md template for a research project
title: '[Agent config] '
labels:
- agent-config
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing an agent config. Write a short title after the prefix, for example "[Agent config] AGENTS.md
      for a Python data-analysis repository". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What it does, and for which projects
    placeholder: 'Conventions for a Python data-analysis repository with NumPy and pandas: units, random seeds and tests.'
  validations:
    required: true
- type: textarea
  id: config
  attributes:
    label: The file to copy
    description: AGENTS.md or CLAUDE.md, whole. Mark the parts to adapt in [square brackets].
    render: markdown
  validations:
    required: true
- type: textarea
  id: check
  attributes:
    label: How to check the result
    description: 'Concrete: what to compare, recompute or look up. Not ''verify the output''.'
    placeholder: Give the agent a task that tempts it to break a rule (a measurement without its unit) and see whether it
      stops and asks.
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: How you tested it
    description: 'Leave empty if you have not tested it yet: it is published as a draft (L0). Otherwise start with the model
      and the date, then the real task you ran it on and what came out (L1).'
    placeholder: 'Claude Opus 5.5 in Claude Code, 2026-11-04: asked to add a plot from a column without units, the agent stopped
      and asked.'
  validations:
    required: false
- type: textarea
  id: fails
  attributes:
    label: Known failures
    description: Cases where it gave wrong results, or limits you know of.
  validations:
    required: false
- type: dropdown
  id: phase
  attributes:
    label: Research phase
    options:
    - Literature
    - Proposals
    - Data and code
    - Analysis
    - Writing
    - Pre-submission review
    - General (any phase)
    multiple: false
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors
    description: 'One per line, as they should appear in the citation: name, then affiliation, ORCID and GitHub @username
      if you want them (only the name is needed).'
    placeholder: First Last, Institute, 0000-0000-0000-0000, @username
  validations:
    required: true

name: Prompt
description: A single prompt that worked on a real research task
title: '[Prompt] '
labels:
- prompt
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a prompt. Write a short title after the prefix, for example "[Prompt] Pre-submission referee
      report". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT. You are credited with the name on your GitHub profile unless you write other
      authors below.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What it does, in one sentence
    placeholder: Ask a model to review your draft the way a demanding referee would.
  validations:
    required: true
- type: textarea
  id: prompt
  attributes:
    label: Prompt
    description: Exactly as you used it.
    render: text
  validations:
    required: true
- type: textarea
  id: check
  attributes:
    label: How to check the result
    description: 'Concrete: what to compare, recompute or look up. Not ''verify the output''.'
    placeholder: Recompute every number in the report; look up each reference.
  validations:
    required: true
- type: textarea
  id: example
  attributes:
    label: Example
    description: A real input and the output you got (shorten if long).
  validations:
    required: false
- type: textarea
  id: test
  attributes:
    label: How you tested it
    description: 'Leave empty if you have not tested it yet: it is published as a draft (L0). Otherwise start with the model
      and the date, then the real task you ran it on and what came out (L1).'
    placeholder: 'Claude Opus 5.5 in claude.ai, 2026-11-02: our own published paper, given to it as a draft; it raised 3 of
      the 4 main points of the real referee.'
  validations:
    required: false
- type: textarea
  id: fails
  attributes:
    label: Known failures
    description: Cases where it gave wrong results, or limits you know of.
    placeholder: 'It cannot check numbers it cannot recompute: silence on a result means "not checked".'
  validations:
    required: false
- type: dropdown
  id: phase
  attributes:
    label: Research phase
    options:
    - Literature
    - Proposals
    - Data and code
    - Analysis
    - Writing
    - Pre-submission review
    - General (any phase)
    multiple: false
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors, if not only you
    description: 'Leave empty to be credited with the name on your GitHub profile. Otherwise one per line: name, ORCID (optional),
      affiliation (optional), GitHub @username (optional).'
    placeholder: First Last, 0000-0000-0000-0000, Institute, @username
  validations:
    required: false

name: Skill
description: Instructions and scripts an AI agent loads when a task needs them
title: '[Skill] '
labels:
- skill
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a skill. Write a short title after the prefix, for example "[Skill] Calculations that
      keep their units". Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT. You are credited with the name on your GitHub profile unless you write other
      authors below.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What it does, in one sentence
    placeholder: Makes an agent carry units through every calculation and stop when one is missing.
  validations:
    required: true
- type: textarea
  id: skill_md
  attributes:
    label: SKILL.md
    description: 'Paste the whole file, front matter included, or drop a .zip of the skill folder in the next box instead.
      The description line decides when the agent loads the skill: start it with "Use when...".'
    render: markdown
  validations:
    required: false
- type: textarea
  id: files
  attributes:
    label: Skill folder as a .zip, or other files
    description: Drop a .zip of the whole skill folder here (SKILL.md and its scripts). Or paste each other file in a code
      block, with its file name on the line before.
  validations:
    required: false
- type: textarea
  id: check
  attributes:
    label: How to check the result
    description: 'Concrete: what to compare, recompute or look up. Not ''verify the output''.'
    placeholder: Give it ten calculations with known answers and a unit trap (km/s against m/s), with and without the skill.
  validations:
    required: true
- type: textarea
  id: test
  attributes:
    label: How you tested it
    description: 'Leave empty if you have not tested it yet: it is published as a draft (L0). Otherwise start with the model
      and the date, then the real task you ran it on and what came out (L1).'
    placeholder: 'Claude Opus 5.5 in Claude Code, 2026-11-04: ten unit conversions with known answers, 10/10 with the skill
      and 6/10 without.'
  validations:
    required: false
- type: textarea
  id: fails
  attributes:
    label: Known failures
    description: Cases where it gave wrong results, or limits you know of.
  validations:
    required: false
- type: dropdown
  id: phase
  attributes:
    label: Research phase
    options:
    - Literature
    - Proposals
    - Data and code
    - Analysis
    - Writing
    - Pre-submission review
    - General (any phase)
    multiple: false
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors, if not only you
    description: 'Leave empty to be credited with the name on your GitHub profile. Otherwise one per line: name, ORCID (optional),
      affiliation (optional), GitHub @username (optional).'
    placeholder: First Last, 0000-0000-0000-0000, Institute, @username
  validations:
    required: false

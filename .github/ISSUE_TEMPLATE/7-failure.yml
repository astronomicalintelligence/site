name: Failure
description: A real error made by a language model on a research task
title: '[Failure] '
labels:
- failure
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a failure. Write a short, task-based title after the prefix, for example "[Failure] Invented
      citations".


      You can drag and drop images (screenshots, plots) into any text box: they are copied into the site with the page. Use
      only images you made or may share under CC BY 4.0.


      A maintainer checks every proposal; when it is marked **ready** it is turned into a page and a pull request, and it
      gets its catalogue number when it is published. The guide is in [Contribute](https://github.com/astronomicalintelligence/site/blob/main/contribute.qmd).'
- type: input
  id: description
  attributes:
    label: What went wrong, in one sentence
    placeholder: The model cited a paper that does not exist.
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: Kind of error
    options:
    - Invented reference
    - Wrong number or unit
    - Wrong derivation
    - Code that runs but is wrong
    - Misread source
    - Other
    multiple: false
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened
    description: The task, what the model answered and what the right answer was.
  validations:
    required: true
- type: textarea
  id: prompt
  attributes:
    label: Prompt
    description: Exactly as used, if you can share it.
    render: text
  validations:
    required: false
- type: textarea
  id: caught
  attributes:
    label: How you caught it
    placeholder: The DOI did not resolve and ADS had no paper with that title.
  validations:
    required: true
- type: textarea
  id: prevent
  attributes:
    label: How to prevent it
    description: The check that would have caught it.
  validations:
    required: true
- type: input
  id: model
  attributes:
    label: Model and version
    description: The model that made the error.
    placeholder: for example Claude Opus 5.5
  validations:
    required: true
- type: input
  id: tool
  attributes:
    label: Tool or interface
    placeholder: for example claude.ai, Claude Code, Codex, ChatGPT, the API
  validations:
    required: false
- type: input
  id: tested
  attributes:
    label: When it happened
    placeholder: YYYY-MM-DD
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors to credit
    description: 'One per line: name, ORCID (optional), affiliation, as they should appear in the citation. Or write ''anonymous''.'
  validations:
    required: true
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: I agree that the text is published under CC BY 4.0 and any code under MIT.
      required: true

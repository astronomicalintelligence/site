name: Failure
description: A real error made by a language model on a research task
title: '[Failure] '
labels:
- failure
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a failure. Write a short title after the prefix, for example "[Failure] Invented citations".
      Only the fields marked with a red star are needed.


      You can drag and drop images (screenshots, plots) into any text box. By submitting you agree that the text is published
      under CC BY 4.0 and any code under MIT. You are credited with the name on your GitHub profile unless you write other
      authors below.


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: description
  attributes:
    label: What went wrong, in one sentence
    placeholder: The model cited a paper that does not exist.
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened
    description: The model and version, the date, the task or prompt, what it answered and what the right answer was.
    placeholder: Claude Opus 5.5 in claude.ai, 2026-10-20. Asked for the reference of a measured value, it gave a paper with
      a plausible title and a DOI that does not exist.
  validations:
    required: true
- type: textarea
  id: catch
  attributes:
    label: How to catch or avoid it
    description: The check that caught it, or would have.
    placeholder: Look up every DOI; ADS had no paper with that title.
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: Kind of error
    options:
    - Invented reference
    - Wrong number or unit
    - Wrong derivation
    - Code that runs but is wrong
    - Misread source
    - Other
    multiple: false
  validations:
    required: false
- type: textarea
  id: authors
  attributes:
    label: Authors, if not only you
    description: 'Leave empty to be credited with the name on your GitHub profile. Otherwise one per line: name, ORCID (optional),
      affiliation (optional), GitHub @username (optional).'
    placeholder: First Last, 0000-0000-0000-0000, Institute, @username
  validations:
    required: false

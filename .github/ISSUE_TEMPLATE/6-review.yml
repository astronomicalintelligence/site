name: Review
description: Suggest a published paper for a second, AI-assisted peer review
title: '[Review] '
labels:
- review
body:
- type: markdown
  attributes:
    value: 'Thank you for proposing a paper for review. Write a short title after the prefix, for example "[Review] Title
      of the paper".


      More in [Contribute](https://astronomicalintelligence.org/contribute.html).'
- type: input
  id: paper
  attributes:
    label: Paper
    description: Link to the published version, DOI or ADS bibcode.
    placeholder: https://doi.org/10.xxxx/...
  validations:
    required: true
- type: dropdown
  id: open_access
  attributes:
    label: Is it open access?
    options:
    - 'Yes'
    - 'No'
    - Don't know
    multiple: false
  validations:
    required: true
- type: textarea
  id: why
  attributes:
    label: Why this paper
    description: For example a widely cited result, a claim you doubt, or a method many people reuse.
  validations:
    required: true
- type: dropdown
  id: is_author
  attributes:
    label: Are you one of the authors?
    options:
    - 'No'
    - 'Yes'
    multiple: false
  validations:
    required: true
- type: dropdown
  id: can_check
  attributes:
    label: Could you check the model's points as a scientist in the field?
    options:
    - 'Yes'
    - 'No'
    multiple: false
  validations:
    required: true

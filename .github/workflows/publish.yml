name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to commit the catalogue numbers and folder names given to new contributions
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      # Pull requests: only check (fails if two contributions share a number
      # or a number already given on main was changed).
      # Main: give the next free number to every new contribution and rename its
      # folder to AI<letter><number>-<name>, before rendering.
      - name: Fetch main to compare catalogue numbers
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - name: Catalogue numbers
        run: python3 tools/catalog_ids.py ${{ github.event_name != 'pull_request' && '--write' || '--base origin/main' }}
      - name: No external images
        run: python3 tools/check_images.py
      - name: Render site
        run: quarto render
      - name: Save new catalogue numbers
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Assign catalogue numbers and folders [skip ci]"
            # if main moved meanwhile, the next run assigns the numbers again
            git pull --rebase origin main && git push || echo "::warning::catalogue numbers not saved; they will be assigned on the next run"
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

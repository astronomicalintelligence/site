filters:
  - ../_filters/fits-header.lua
  - ../_filters/type-tag.lua
  - ../_filters/page-actions.lua
# Every contributed page shows its authors and a "How to cite" box
# (Quarto builds the citation from title, author, date and the page URL).
citation:
  type: webpage
  container-title: "Astronomical Intelligence"
body-classes: type-reviews
# Comments: one GitHub Discussion per contribution (giscus), category "Comments"
comments:
  giscus:
    repo: astronomicalintelligence/site
    repo-id: "R_kgDOVeKQmg"
    category: "Comments"
    category-id: "DIC_kwDOVeKQms4DKRzA"
    mapping: pathname
    reactions-enabled: true
    input-position: top
    theme:
      light: light
      dark: dark_dimmed
